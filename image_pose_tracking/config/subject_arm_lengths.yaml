# Per-subject arm geometry and grip calibration.
#
# grip_offset: hand-frame rotation [x, y, z] in DEGREES, applied on top of the
# nominal ee_to_hand rotation to model grip compliance (the static rotation
# between the robot tool and where the hand actually seats). Applied as intrinsic
# X->Y->Z about the hand-frame axes: R_offset = Rx * Ry * Rz, right-multiplied
# onto the nominal ee_to_hand rotation. [0, 0, 0] is a no-op (use the nominal).
subjects:
  subject_1:
    upper_arm_length: 0.29
    forearm_length: 0.244
    hand_length: 0.08
    grip_offset: [0.0, 0.0, 0.0]
